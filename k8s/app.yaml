apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-web
  template:
    metadata:
      labels:
        app: cicd-web
    spec:
      containers:
        - name: web
          image: cicd-lab:0.2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-web
spec:
  selector:
    app: cicd-web
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
